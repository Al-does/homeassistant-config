- id: run_scripts_after_global_lights_off_time
  alias: Run Scripts After Global Lights Off Time
  trigger:
  - platform: template
    value_template: '{{ (states(''input_datetime.global_lights_off_time'') | as_timestamp)
      + 60 <= now().timestamp() }}'
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: 'off'
      sequence:
      - service: script.reactivate_art_room_dimmer
