- id: start_fade_in_lights
  alias: Start Fade-In Lights
  description: Enroll sunset fade-in lights at their configured per-light start times.
  trigger:
  - platform: time_pattern
    minutes: /1
  condition:
  - condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
  action:
  - service: python_script.fade_out
    data:
      function_name: start_fade_in
      entity_id: light.bar_wled
      current_time: '{{ now().strftime(''%H:%M:%S'') }}'
  - service: python_script.fade_out
    data:
      function_name: start_fade_in
      entity_id: light.window_top_shelf_wled
      current_time: '{{ now().strftime(''%H:%M:%S'') }}'
  - service: python_script.fade_out
    data:
      function_name: start_fade_in
      entity_id: light.window_mid_shelf_wled
      current_time: '{{ now().strftime(''%H:%M:%S'') }}'
  - service: python_script.fade_out
    data:
      function_name: start_fade_in
      entity_id: light.kitchen_top_shelf_wled_segment_1
      current_time: '{{ now().strftime(''%H:%M:%S'') }}'
  - service: python_script.fade_out
    data:
      function_name: start_fade_in
      entity_id: light.kitchen_mid_shelf_wled_segment_1
      current_time: '{{ now().strftime(''%H:%M:%S'') }}'
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: person.anna_tong
        state: home
      - condition: state
        entity_id: person.alex_vardakostas
        state: home
    then:
    - service: python_script.fade_out
      data:
        function_name: start_fade_in
        entity_id: light.urban_outfiters
        current_time: '{{ now().strftime(''%H:%M:%S'') }}'
    - service: python_script.fade_out
      data:
        function_name: start_fade_in
        entity_id: light.hue_color_lamp_1_2
        current_time: '{{ now().strftime(''%H:%M:%S'') }}'
    - service: python_script.fade_out
      data:
        function_name: start_fade_in
        entity_id: light.bookshelf_lights
        current_time: '{{ now().strftime(''%H:%M:%S'') }}'
    - service: python_script.fade_out
      data:
        function_name: start_fade_in
        entity_id: light.giraffe_lamp
        current_time: '{{ now().strftime(''%H:%M:%S'') }}'
    - service: python_script.fade_out
      data:
        function_name: start_fade_in
        entity_id: light.under_cabinet_lights
        current_time: '{{ now().strftime(''%H:%M:%S'') }}'
    - service: python_script.fade_out
      data:
        function_name: start_fade_in
        entity_id: light.dimmable_light_1
        current_time: '{{ now().strftime(''%H:%M:%S'') }}'
    - service: python_script.fade_out
      data:
        function_name: start_fade_in
        entity_id: light.hue_white_lamp_1
        current_time: '{{ now().strftime(''%H:%M:%S'') }}'
  mode: single
