- id: humidity_control_with_smart_plug
  alias: Control Humidity with Smart Plug
  description: Turn smart plug on/off based on humidity sensor readings between specific
    times
  trigger:
  - platform: time
    at: '18:15:00'
  - platform: time
    at: '22:45:00'
  - platform: state
    entity_id: sensor.bedroom_current_humidity
  condition: []
  action:
  - choose:
    - conditions:
      - condition: time
        after: '18:15:00'
        before: '22:45:00'
      - condition: numeric_state
        entity_id: sensor.bedroom_current_humidity
        above: 58
      sequence:
      - target:
          entity_id: switch.sengled_smart_plug_1_switch
        action: switch.turn_on
        data: {}
    - conditions:
      - condition: time
        after: '18:15:00'
        before: '22:45:00'
      - condition: numeric_state
        entity_id: sensor.bedroom_current_humidity
        below: 50
      sequence:
      - target:
          entity_id: switch.sengled_smart_plug_1_switch
        action: switch.turn_off
        data: {}
    default:
    - target:
        entity_id: switch.sengled_smart_plug_1_switch
      action: switch.turn_off
      data: {}
  mode: single
