- id: first_person_home_lights_on
  alias: Turn On Lights When First Person Arrives Home
  description: Reactivate dimmers only when transitioning from nobody home to someone
    home. A second arrival while someone is already home does nothing.
  trigger:
  - platform: state
    entity_id:
    - person.alex_vardakostas
    - person.anna_tong
    from: not_home
    to: home
  condition:
  - condition: template
    value_template: '{{ (states(''person.alex_vardakostas'') == ''home'') | int +
      (states(''person.anna_tong'') == ''home'') | int == 1 }}'
  action:
  - service: script.reactivate_all_dimmers
    metadata: {}
    data: {}
  mode: single
- id: turn_off_lights_when_no_one_is_home
  alias: Turn Off Lights When No One is Home
  description: Turn off lights only when transitioning from someone home to nobody
    home. One person leaving while another remains does nothing.
  trigger:
  - platform: state
    entity_id:
    - person.alex_vardakostas
    - person.anna_tong
    to: not_home
  condition:
  - condition: state
    entity_id: person.alex_vardakostas
    state: not_home
  - condition: state
    entity_id: person.anna_tong
    state: not_home
  - condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
  action:
  - service: light.turn_off
    entity_id:
    - light.under_cabinet_lights
    - light.dimmable_light_1
    - light.hue_white_lamp_1
    - light.hue_white_lamp_2
    - light.hue_white_lamp_3
    - light.bookshelf_lights
    - light.giraffe_lamp
    - light.kitchen_desk_lamp
    - light.urban_outfiters
    - light.living_room_pendants
    - light.bedroom_overhead
    - light.bedroom_reading
  - service: input_boolean.turn_off
    data:
      entity_id:
      - input_boolean.light_under_cabinet_lights_is_active
      - input_boolean.light_dimmable_light_1_is_active
      - input_boolean.light_hue_white_lamp_1_is_active
      - input_boolean.light_hue_white_lamp_2_is_active
      - input_boolean.light_hue_white_lamp_3_is_active
      - input_boolean.light_living_room_pendants_is_active
      - input_boolean.light_bookshelf_lights_is_active
      - input_boolean.light_giraffe_lamp_is_active
      - input_boolean.light_kitchen_desk_lamp_is_active
      - input_boolean.light_urban_outfiters_is_active
- id: run_scripts_after_global_lights_off_time
  alias: Run Scripts After Global Lights Off Time
  trigger:
  - platform: template
    value_template: '{{ (states(''input_datetime.global_lights_off_time'') | as_timestamp)
      + 60 <= now().timestamp() }}'
  action:
  - service: script.reactivate_art_room_dimmer
  - service: script.reactivate_kitchen_dimmer
  - service: script.reactivate_dining_room_dimmer
