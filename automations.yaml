- id: warm_color_temperature_bulbs_at_fader_start
  alias: Warm Color Temperature Bulbs at Fader Start
  description: Set already-on configured bulbs to the fader's warm color temperature when the evening fader engages.
  trigger:
  - platform: template
    value_template: '{{ states("input_datetime.global_fader_start_time") == now().strftime("%H:%M:%S")
      }}'
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.alex_vardakostas
      state: home
    - condition: state
      entity_id: person.anna_tong
      state: home
  - condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
  action:
  - service: python_script.fade_out
    data:
      function_name: warm_configured_color_temperature
  mode: single
- id: update_global_fader_start_time_to_sunset
  alias: Update Global Fader Start Time to Sunset
  description: Keep the dashboard start-time helper aligned with the local sunset time.
  trigger:
  - platform: homeassistant
    event: start
  - platform: time
    at: '12:00:00'
  action:
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.global_fader_start_time
    data:
      time: '{{ as_timestamp(state_attr(''sun.sun'', ''next_setting'')) | timestamp_custom(''%H:%M:00'', true) }}'
  mode: single
- id: update_fade_in_start_times_to_sunset_offsets
  alias: Update Fade-In Start Times to Sunset Offsets
  description: Keep fade-in helpers aligned with local sunset offsets.
  trigger:
  - platform: homeassistant
    event: start
  - platform: time
    at: '12:00:00'
  action:
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.global_fade_in_start_time
    data:
      time: '{{ (as_timestamp(state_attr(''sun.sun'', ''next_setting'')) - 20 * 60) | timestamp_custom(''%H:%M:00'', true) }}'
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.light_giraffe_lamp_fade_in_start_time
    data:
      time: '{{ (as_timestamp(state_attr(''sun.sun'', ''next_setting'')) - 2 * 60 * 60) | timestamp_custom(''%H:%M:00'', true) }}'
  - service: input_datetime.set_datetime
    target:
      entity_id:
      - input_datetime.light_under_cabinet_lights_fade_in_start_time
      - input_datetime.light_dimmable_light_1_fade_in_start_time
      - input_datetime.light_hue_white_lamp_1_fade_in_start_time
    data:
      time: '{{ (as_timestamp(state_attr(''sun.sun'', ''next_setting'')) - 50 * 60) | timestamp_custom(''%H:%M:00'', true) }}'
  mode: single
