- id: deck_seat_auto_off_90min
  alias: Deck seat - auto off after 90 min
  mode: restart
  trigger:
    - platform: state
      entity_id: switch.deck_switch_deck_seat
      to: "on"
    - platform: state
      entity_id: switch.deck_switch_deck_seat
      to: "off"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'on' }}"
          sequence:
            - delay: "01:30:00"
            - service: switch.turn_off
              target:
                entity_id: switch.deck_switch_deck_seat
      default:
        - stop: "Switch turned off before timer elapsed; cancel pending shutoff."
- id: deck_seat_overheat_notify
  alias: Deck seat - overheat alert
  description: Buzz phone when the heated deck seat outlet reports overheating.
  triggers:
    - trigger: state
      entity_id: binary_sensor.deck_seat_overheated
      to: "on"
  conditions: []
  actions:
    - action: notify.send_message
      data:
        title: Deck seat overheating
        message: >-
          The heated deck seat outlet is reporting an overheat condition.
          It may have shut off automatically.
        data:
          ttl: 0
          priority: high
          vibrationPattern: [0, 500, 200, 500, 200, 500]
      target:
        entity_id: person.alex_vardakostas
  mode: single
