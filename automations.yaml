- id: deck_seat_auto_off_90min
  alias: Deck seat - auto off after 90 min
  mode: restart
  trigger:
    - platform: state
      entity_id: switch.deck_switch_deck_seat
      to: "on"
    - platform: state
      entity_id: switch.deck_switch_deck_seat
      to: "off"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'on' }}"
          sequence:
            - delay: "01:30:00"
            - service: switch.turn_off
              target:
                entity_id: switch.deck_switch_deck_seat
      default:
        - stop: "Switch turned off before timer elapsed; cancel pending shutoff."
