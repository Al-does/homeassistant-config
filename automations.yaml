- id: '1720767728904'
  alias: Fade In - L-Bar Lights
  description: At sunset, fade in bar lights using Ashley and increase the color temp.
  trigger:
  - platform: sun
    event: sunset
    offset: '-3:00:00'
  condition: []
  action:
  - service: script.1720765151144
    metadata: {}
    data:
      lampBrightnessScale: zeroToTwoFiftyFive
      easingTypeInput: auto
      endBrightnessPercent: 87
      endBrightnessEntityScale: zeroToOneHundred
      autoCancelThreshold: 10
      shouldStopIfTheLampIsTurnedOffDuringTheFade: true
      shouldResetTheStopEntityToOffAtStart: false
      shouldInvertTheValueOfTheStopEntity: false
      minimumStepDelayInMilliseconds: 100
      shouldTryToUseNativeLampTransitionsToo: false
      isDebugMode: false
      light: light.bar_lights
      transitionTime:
        hours: 0
        minutes: 30
        seconds: 0
      endColorTemperatureKelvin: 5000
  mode: single
- id: turn_on_lights_boolean
  alias: Turn On Lights Boolean
  trigger:
  - platform: template
    value_template: '{{ states("input_datetime.global_fader_start_time") == now().strftime("%H:%M:%S")
      }}'
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.alex_vardakostas
      state: home
    - condition: state
      entity_id: person.anna_tong
      state: home
  - condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
  action:
  - service: input_boolean.turn_on
    entity_id:
    - input_boolean.light_kitchen_desk_lamp_is_active
    - input_boolean.light_under_cabinet_lights_is_active
    - input_boolean.light_bookshelf_lights_is_active
    - input_boolean.light_dimmable_light_1_is_active
    - input_boolean.light_urban_outfiters_is_active
    - input_boolean.light_giraffe_lamp_is_active
    - input_boolean.light_hue_white_lamp_1_is_active
    - input_boolean.light_hue_white_lamp_2_is_active
    - input_boolean.light_hue_white_lamp_3_is_active
    - input_boolean.light_kitchen_desk_lamp_needs_reset
    - input_boolean.light_under_cabinet_lights_needs_reset
    - input_boolean.light_bookshelf_lights_needs_reset
    - input_boolean.light_dimmable_light_1_needs_reset
    - input_boolean.light_urban_outfiters_needs_reset
    - input_boolean.light_giraffe_lamp_needs_reset
    - input_boolean.light_hue_white_lamp_1_needs_reset
    - input_boolean.light_hue_white_lamp_2_needs_reset
    - input_boolean.light_hue_white_lamp_3_needs_reset
    - input_boolean.light_living_room_pendants_is_active
    - input_boolean.light_living_room_pendants_needs_reset
- id: fade_under_cabinet_lights
  alias: call the UCL adjust_brightness routine every minute
  trigger:
  - platform: time_pattern
    minutes: /1
  condition:
  - condition: state
    entity_id: input_boolean.light_under_cabinet_lights_is_active
    state: 'on'
  action:
  - service: python_script.hello_world
    data:
      function_name: adjust_brightness
      entity_id: light.under_cabinet_lights
      current_time: '{{ now().strftime(''%H:%M:%S'') }}'
      sunset_time: '{{ as_timestamp(states.sun.sun.attributes.next_setting) | timestamp_custom(''%H:%M:%S'')
        }}'
