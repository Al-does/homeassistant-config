- id: make_the_kitchen_bright_again_2
  alias: Make the Kitchen Bright Again
  description: Sets kitchen lights to full brightness and turns off associated booleans
  trigger:
  - platform: state
    entity_id:
    - input_button.kitchen_bright_button
    from: 'on'
    to: 'off'
  action:
  - service: light.turn_on
    target:
      entity_id:
      - light.under_cabinet_lights
      - light.dimmable_light_1
      - light.hue_white_lamp_1
      - light.hue_white_lamp_2
      - light.hue_white_lamp_3
    data:
      brightness_pct: 100
  - service: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.light_under_cabinet_lights_is_active
      - input_boolean.light_dimmable_light_1_is_active
      - input_boolean.light_hue_white_lamp_1_is_active
      - input_boolean.light_hue_white_lamp_2_is_active
      - input_boolean.light_hue_white_lamp_3_is_active
  mode: single
- id: reactivate_kitchen_dimmer_auto
  alias: Reactivate the kitchen dimmer
  description: Re-enables kitchen dimmer settings and resets necessary input booleans
  trigger:
    platform: state
    entity_id: input_button.reactivate_kitchen_dimmer
    to: 'on'
  action:
  - service: input_boolean.turn_on
    entity_id:
    - input_boolean.light_under_cabinet_lights_needs_reset
    - input_boolean.light_dimmable_light_1_needs_reset
    - input_boolean.light_hue_white_lamp_1_needs_reset
    - input_boolean.light_hue_white_lamp_2_needs_reset
    - input_boolean.light_hue_white_lamp_3_needs_reset
    - input_boolean.light_under_cabinet_lights_is_active
    - input_boolean.light_dimmable_light_1_is_active
    - input_boolean.light_hue_white_lamp_1_is_active
    - input_boolean.light_hue_white_lamp_2_is_active
    - input_boolean.light_hue_white_lamp_3_is_active
