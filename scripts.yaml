play_music:
  alias: Play Music
  sequence: []
  mode: single
'1711358669019':
  sequence:
  - service: light.turn_on
    target:
      entity_id: light.hue_color_lamp_1
    data:
      brightness_pct: 1
  - delay:
      minutes: 30
  - service: light.turn_off
    target:
      entity_id: light.hue_color_lamp_1
  mode: single
  alias: Going to sleep
brightness_scale:
  alias: Brightness Scale
  mode: single
  sequence:
  - variables:
      input_brightness: '{{ brightness | int }}'
  - service: system_log.write
    data:
      message: 'Input brightness: {{ input_brightness }}'
      level: info
  - choose:
    - conditions: '{{ input_brightness == 0 }}'
      sequence:
      - variables:
          scaled_brightness: 0
    - conditions: '{{ input_brightness > 0 }}'
      sequence:
      - variables:
          scaled_brightness: '{{ (input_brightness | float) ** 2 / 100 }}'
  - service: system_log.write
    data:
      message: 'Scaled brightness: {{ scaled_brightness }}'
      level: info
  - service: light.turn_on
    target:
      entity_id: light.under_cabinet_lights
    data:
      brightness_pct: '{{ scaled_brightness | int }}'

reactivate_kitchen_dimmer:
 alias: "Reactivate Kitchen Dimmer"
 sequence:
  - service: input_boolean.turn_on
    data:
     entity_id:
      - input_boolean.light_under_cabinet_lights_needs_reset
      - input_boolean.light_dimmable_light_1_needs_reset
      - input_boolean.light_hue_white_lamp_1_needs_reset
      - input_boolean.light_hue_white_lamp_2_needs_reset
      - input_boolean.light_hue_white_lamp_3_needs_reset
      - input_boolean.light_under_cabinet_lights_is_active
      - input_boolean.light_dimmable_light_1_is_active
      - input_boolean.light_hue_white_lamp_1_is_active
      - input_boolean.light_hue_white_lamp_2_is_active
      - input_boolean.light_hue_white_lamp_3_is_active
  - service: automation.trigger
    data:
     entity_id:
      - automation.fade_dimmable_light_1
      - automation.fade_under_cabinet_lights
      - automation.fade_hue_white_lamp_1
      - automation.fade_hue_white_lamp_2
      - automation.fade_hue_white_lamp_3
      
