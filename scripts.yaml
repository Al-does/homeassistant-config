art_room_overhead_max:
 alias: "Art Room Overhead Max Brightness"
 mode: single
 sequence:
  - repeat:
      for_each:
        - light.west_4
        - light.hue_color_lamp_5
        - light.hue_color_lamp_2
        - light.hue_color_lamp_1_3
        - light.hue_color_lamp_3
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ repeat.item }}"
          data:
            brightness: "{{ states('input_number.' ~ repeat.item | replace('.', '_') ~ '_max_brightness') | int(255) }}"

