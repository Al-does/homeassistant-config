make_kitchen_bright_again:
 alias: "Make the Kitchen Bright Again"
 description: "Sets kitchen lights to full brightness and turns off associated booleans"
 sequence:
  - service: light.turn_on
    target:
     entity_id:
      - light.under_cabinet_lights
      - light.dimmable_light_1
      - light.hue_white_lamp_1
      - light.hue_white_lamp_2
      - light.hue_white_lamp_3
    data:
     brightness_pct: 100
  - service: input_boolean.turn_off
    target:
     entity_id:
      - input_boolean.light_under_cabinet_lights_is_active
      - input_boolean.light_dimmable_light_1_is_active
      - input_boolean.light_hue_white_lamp_1_is_active
      - input_boolean.light_hue_white_lamp_2_is_active
      - input_boolean.light_hue_white_lamp_3_is_active
      
