# Sauna temperature alerts.

input_boolean:
  sauna_temp_alert_active:
    name: Sauna Temperature Alert Active
    icon: mdi:thermometer-alert

automation:
  - id: sauna_temp_160_notify
    alias: Sauna temperature high - notify
    description: >-
      Buzz Alex and Anna's devices when the SONOFF sauna temperature reaches
      160°F. Re-alerts only after it drops below 155°F for 2 minutes.
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.sonoff_temp_sensor
    condition:
      - condition: numeric_state
        entity_id: sensor.sonoff_temp_sensor
        above: 159.9
      - condition: state
        entity_id: input_boolean.sauna_temp_alert_active
        state: "off"
    action:
      - service: notify.send_message
        data:
          title: Annex Sauna
          message: Annex Sauna is Ready!
        target:
          entity_id:
            - notify.pixel_10_fold_jade
            - notify.pixel_watch_3
            - notify.samsung_ultra_2
            - notify.iphone2
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.sauna_temp_alert_active

  - id: sauna_temp_clear_latch
    alias: Sauna temperature - clear alert latch
    description: >-
      Reset notification latch once sauna temperature falls below 155°F for
      2 minutes.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.sonoff_temp_sensor
        below: 155
        for:
          minutes: 2
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.sauna_temp_alert_active
