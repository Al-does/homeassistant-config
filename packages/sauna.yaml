# Sauna temperature alerts.

input_boolean:
  sauna_temp_alert_active:
    name: Sauna Temperature Alert Active
    icon: mdi:thermometer-alert

automation:
  - id: sauna_temp_160_notify
    alias: Sauna temperature high - notify
    description: >-
      Buzz Alex and Anna's phones when the SONOFF sauna temperature reaches
      160°F. Re-alerts only after it drops below 155°F for 2 minutes.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.sonoff_temp_sensor
        above: 159.9
    condition:
      - condition: state
        entity_id: input_boolean.sauna_temp_alert_active
        state: "off"
    action:
      - service: notify.send_message
        data:
          title: Sauna temperature high
          message: >-
            Sauna temperature is {{ states('sensor.sonoff_temp_sensor') }}°F.
          data:
            ttl: 0
            priority: high
            vibrationPattern: [0, 500, 200, 500, 200, 500]
        target:
          entity_id:
            - person.alex_vardakostas
            - person.anna_tong
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.sauna_temp_alert_active

  - id: sauna_temp_clear_latch
    alias: Sauna temperature - clear alert latch
    description: >-
      Reset notification latch once sauna temperature falls below 155°F for
      2 minutes.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.sonoff_temp_sensor
        below: 155
        for:
          minutes: 2
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.sauna_temp_alert_active
