# Light groups for unified control of multi-bulb fixtures.
light:
  - platform: group
    name: Bookshelf Lights
    entities:
      - light.dimmable_light_1_2  # Bookshelf Center
      - light.dimmable_light_1_3  # Bookshelf Upper
      - light.dimmable_light_1_4  # Bookshelf Lower

  - platform: group
    name: Art Room Overhead Lights
    entities:
      - light.west_4
      - light.hue_color_lamp_5
      - light.hue_color_lamp_2
      - light.hue_color_lamp_1_3
      - light.hue_color_lamp_3

  - platform: group
    name: Art Room Lamps
    entities:
      - light.urban_outfiters  # Floor lamp
      - light.hue_color_lamp_1_2  # Yellow lamp

  - platform: group
    name: Window WLED Lights
    entities:
      - light.window_top_shelf_wled
      - light.window_mid_shelf_wled

  # WLED segment index 1 ("Every third", grp=1/spc=3) on each strip.
  # Boot preset 1 ("Boot") on both devices restores this layout after power loss.
  - platform: group
    name: Kitchen Shelf WLED
    entities:
      - light.kitchen_top_shelf_wled_segment_1
      - light.kitchen_mid_shelf_wled_segment_1
