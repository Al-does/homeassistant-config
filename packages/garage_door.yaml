# Garage door alerts.

automation:
  - id: garage_door_left_open_notify
    alias: Garage door left open - notify
    description: >-
      Buzz Alex and Anna's devices when the garage door stays open
      for more than 5 minutes.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.garage_door_sensor
        to: "on"
        for:
          minutes: 5
    action:
      - service: notify.send_message
        data:
          title: Garage door left open
          message: >-
            The garage door has been open for more than 5 minutes.
        target:
          entity_id:
            - notify.pixel_10_fold_jade
            - notify.samsung_ultra_2
            - notify.iphone2
