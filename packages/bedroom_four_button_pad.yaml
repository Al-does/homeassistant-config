# Bedroom "Four Button Pad #4" and "#5" (TS0044) remotes via ZHA.
# Both pads share the same button mapping below.
# btn1: curtains open / close / west-half-east-open
# btn2: Ann's + Al's lamps 50/15, double-off, hold-100
# btn3: overhead lights 60 / off / 100
# btn4: Al's Tired / Al's Going to Bed

automation:
  - id: bedroom_four_button_pad_4
    alias: Bedroom Four Button Pad Automations
    description: >-
      Bedroom remote: btn1 curtains open/close/west-half,
      btn2 Ann+Al lamps 50-15/off, btn3 overheads 60/off/100,
      btn4 Al's Tired / Al's Going to Bed
    use_blueprint:
      path: zpriddy/ts0044_zigbee_remote.yaml
      input:
        ts0044_device: fd0374baa99238f40caab19531deb949
        button_1_press:
          - action: script.bedroom_curtains_open
            data: {}
        button_1_double_press:
          - action: script.bedroom_curtains_close
            data: {}
        button_1_held:
          - action: script.bedroom_curtains_west_half
            data: {}
        button_2_press:
          - action: light.turn_on
            target:
              entity_id: light.hue_ambiance_lamp_1
            data:
              brightness_pct: 50
          - action: light.turn_on
            target:
              entity_id: light.hue_color_lamp_1
            data:
              brightness_pct: 15
        button_2_double_press:
          - action: light.turn_off
            target:
              entity_id:
                - light.hue_ambiance_lamp_1
                - light.hue_color_lamp_1
        button_2_held:
          - action: light.turn_on
            target:
              entity_id:
                - light.hue_ambiance_lamp_1
                - light.hue_color_lamp_1
            data:
              brightness_pct: 100
        button_3_press:
          - action: light.turn_on
            target:
              entity_id:
                - light.master_bedroom_main_lights_west
                - light.master_bedroom_main_lights_east
            data:
              brightness_pct: 60
        button_3_double_press:
          - action: light.turn_off
            target:
              entity_id:
                - light.master_bedroom_main_lights_west
                - light.master_bedroom_main_lights_east
        button_3_held:
          - action: light.turn_on
            target:
              entity_id:
                - light.master_bedroom_main_lights_west
                - light.master_bedroom_main_lights_east
            data:
              brightness_pct: 100
        button_4_press:
          - action: script.al_is_tired
            data: {}
        button_4_double_press:
          - action: script.als_going_to_bed
            data: {}

  - id: bedroom_four_button_pad_5
    alias: Bedroom Four Button Pad 5 Automations
    description: >-
      Bedroom remote #5: same mapping as pad #4 —
      btn1 curtains open/close/west-half,
      btn2 Ann+Al lamps 50-15/off/100, btn3 overheads 60/off/100,
      btn4 Al's Tired / Al's Going to Bed
    use_blueprint:
      path: zpriddy/ts0044_zigbee_remote.yaml
      input:
        ts0044_device: ca5ffe59822a138a4937c9378fccf89d
        button_1_press:
          - action: script.bedroom_curtains_open
            data: {}
        button_1_double_press:
          - action: script.bedroom_curtains_close
            data: {}
        button_1_held:
          - action: script.bedroom_curtains_west_half
            data: {}
        button_2_press:
          - action: light.turn_on
            target:
              entity_id: light.hue_ambiance_lamp_1
            data:
              brightness_pct: 50
          - action: light.turn_on
            target:
              entity_id: light.hue_color_lamp_1
            data:
              brightness_pct: 15
        button_2_double_press:
          - action: light.turn_off
            target:
              entity_id:
                - light.hue_ambiance_lamp_1
                - light.hue_color_lamp_1
        button_2_held:
          - action: light.turn_on
            target:
              entity_id:
                - light.hue_ambiance_lamp_1
                - light.hue_color_lamp_1
            data:
              brightness_pct: 100
        button_3_press:
          - action: light.turn_on
            target:
              entity_id:
                - light.master_bedroom_main_lights_west
                - light.master_bedroom_main_lights_east
            data:
              brightness_pct: 60
        button_3_double_press:
          - action: light.turn_off
            target:
              entity_id:
                - light.master_bedroom_main_lights_west
                - light.master_bedroom_main_lights_east
        button_3_held:
          - action: light.turn_on
            target:
              entity_id:
                - light.master_bedroom_main_lights_west
                - light.master_bedroom_main_lights_east
            data:
              brightness_pct: 100
        button_4_press:
          - action: script.al_is_tired
            data: {}
        button_4_double_press:
          - action: script.als_going_to_bed
            data: {}
