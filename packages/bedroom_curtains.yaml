# Master bedroom SwitchBot curtains.
# Called by Four Button Pad #4 (packages/bedroom_four_button_pad.yaml),
# the Al's Tired / Al's Going to Bed scripts, and dashboards.

script:
  bedroom_curtains_open:
    alias: Bedroom curtains - open fully
    mode: single
    sequence:
      - service: cover.open_cover
        target:
          entity_id:
            - cover.master_bedroom_east_curtain
            - cover.master_bedroom_west_curtain

  bedroom_curtains_close:
    alias: Bedroom curtains - close fully
    mode: single
    sequence:
      - service: cover.close_cover
        target:
          entity_id:
            - cover.master_bedroom_east_curtain
            - cover.master_bedroom_west_curtain

  bedroom_curtains_west_half:
    alias: Bedroom curtains - west half, east open
    mode: single
    sequence:
      - service: cover.set_cover_position
        target:
          entity_id: cover.master_bedroom_west_curtain
        data:
          position: 50
      - service: cover.set_cover_position
        target:
          entity_id: cover.master_bedroom_east_curtain
        data:
          position: 100

  bedroom_curtains_west_90_closed:
    alias: Bedroom curtains - west 90% closed, east closed
    mode: single
    sequence:
      - service: cover.set_cover_position
        target:
          entity_id: cover.master_bedroom_west_curtain
        data:
          position: 10
      - service: cover.set_cover_position
        target:
          entity_id: cover.master_bedroom_east_curtain
        data:
          position: 0
