title: The Circle
views:
  - title: The Circle
    path: the-circle
    cards:
      - type: markdown
        content: |
          Adjust the three global times that drive the evening light fade script.
      - type: entities
        title: Fade Schedule
        show_header_toggle: false
        entities:
          - entity: input_datetime.global_fader_start_time
          - entity: input_datetime.global_fader_end_time
          - entity: input_datetime.global_lights_off_time
      - type: markdown
        content: |
          Reset a room's lights so the fader recalculates brightness on the next fade cycle.
      - type: horizontal-stack
        cards:
          - type: button
            name: Kitchen
            icon: mdi:pot-steam
            tap_action:
              action: call-service
              service: script.reactivate_kitchen_dimmer
          - type: button
            name: Dining Room
            icon: mdi:silverware-fork-knife
            tap_action:
              action: call-service
              service: script.reactivate_dining_room_dimmer
          - type: button
            name: Art Room
            icon: mdi:palette
            tap_action:
              action: call-service
              service: script.reactivate_art_room_dimmer
      - type: button
        name: Reset All Rooms
        icon: mdi:home-lightbulb
        tap_action:
          action: call-service
          service: script.reactivate_all_dimmers
