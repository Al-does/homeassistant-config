title: The Circle
views:
  - title: The Circle
    path: the-circle
    cards:
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.living_room_temperature_2
            above: 78
        card:
          type: markdown
          content: >
            ## ⚠️ Third Floor Hot

            The top floor thermostat is **{{ states('sensor.living_room_temperature_2') }}°F**.
            Consider turning on the A/C or lowering the setpoint.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: person.alex_vardakostas
                state_not: home
              - condition: state
                entity: person.anna_tong
                state_not: home
        card:
          type: map
          title: Where are we?
          aspect_ratio: 16:9
          auto_fit: true
          entities:
            - entity: person.alex_vardakostas
            - entity: person.anna_tong
      - type: vertical-stack
        cards:
          - type: markdown
            content: "**Kitchen**"
          - type: horizontal-stack
            cards:
              - type: button
                name: Max
                icon: mdi:brightness-7
                tap_action:
                  action: call-service
                  service: script.make_kitchen_bright_again
              - type: button
                name: Reset
                icon: mdi:refresh
                tap_action:
                  action: call-service
                  service: script.reactivate_kitchen_dimmer
      - type: vertical-stack
        cards:
          - type: markdown
            content: "**Dining Room**"
          - type: horizontal-stack
            cards:
              - type: button
                name: Max
                icon: mdi:brightness-7
                tap_action:
                  action: call-service
                  service: script.make_dining_room_bright_again
              - type: button
                name: Reset
                icon: mdi:refresh
                tap_action:
                  action: call-service
                  service: script.reactivate_dining_room_dimmer
          - type: tile
            entity: light.kitchen_desk_lamp
            features:
              - type: light-brightness
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - type: vertical-stack
        cards:
          - type: markdown
            content: "**Art Room**"
          - type: horizontal-stack
            cards:
              - type: button
                name: Max
                icon: mdi:brightness-7
                tap_action:
                  action: call-service
                  service: script.make_art_room_bright_again
              - type: button
                name: Reset
                icon: mdi:refresh
                tap_action:
                  action: call-service
                  service: script.reactivate_art_room_dimmer
      - type: vertical-stack
        cards:
          - type: markdown
            content: "**All Rooms**"
          - type: horizontal-stack
            cards:
              - type: button
                name: Max
                icon: mdi:brightness-7
                tap_action:
                  action: call-service
                  service: script.make_all_rooms_max
              - type: button
                name: Reset
                icon: mdi:home-lightbulb
                tap_action:
                  action: call-service
                  service: script.reactivate_all_dimmers
      - type: entities
        title: Fade Schedule
        show_header_toggle: false
        entities:
          - entity: input_datetime.global_fader_start_time
          - entity: input_datetime.global_fader_end_time
          - entity: input_datetime.global_lights_off_time
          - entity: input_boolean.guest_mode
          - entity: input_boolean.fader_enabled
          - entity: input_boolean.fader_booster_is_active
          - entity: input_boolean.fader_peak_reducer_is_active
      - type: horizontal-stack
        cards:
          - type: button
            entity: switch.sengled_switch_2_switch
            name: Boob Lamp
            icon: mdi:lamp
            show_state: true
            tap_action:
              action: toggle
          - type: button
            entity: switch.sauna_lights_third_reality_2_switch
            name: Sauna Lights
            icon: mdi:ceiling-light
            show_state: true
            tap_action:
              action: toggle
          - type: button
            entity: switch.deck_switch_deck_seat
            name: Heated Deck Seat
            icon: mdi:seat-outline
            show_state: true
            tap_action:
              action: toggle
      - type: thermostat
        entity: climate.bedroom_2
        name: Bedroom
      - type: entities
        title: Bedroom Air Quality
        show_header_toggle: false
        entities:
          - entity: sensor.master_bedroom_bedroom_air_quality_sensor_temperature
            name: Temperature
          - entity: sensor.master_bedroom_bedroom_air_quality_sensor_humidity
            name: Humidity
          - entity: sensor.master_bedroom_bedroom_air_quality_sensor_carbon_dioxide
            name: CO2
          - entity: sensor.master_bedroom_bedroom_air_quality_sensor_pm2_5
            name: PM2.5
          - entity: sensor.master_bedroom_bedroom_air_quality_sensor_voc_index
            name: VOC Index
      - type: entities
        title: Top Floor Thermostat
        show_header_toggle: false
        entities:
          - entity: sensor.living_room_temperature_2
            name: Temperature
          - entity: binary_sensor.living_room_occupancy_2
            name: Occupancy
          - entity: sensor.living_room_battery_2
            name: Battery
      - type: thermostat
        entity: climate.9424b8a1064b
        name: Gree Air Conditioner
