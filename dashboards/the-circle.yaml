title: The Circle
views:
  - title: The Circle
    path: the-circle
    cards:
      - type: entities
        title: Fade Schedule
        show_header_toggle: false
        entities:
          - entity: input_datetime.global_fader_start_time
          - entity: input_datetime.global_fader_end_time
          - entity: input_datetime.global_lights_off_time
      - type: horizontal-stack
        cards:
          - type: button
            entity: switch.sengled_switch_2_switch
            name: Boob Lamp
            icon: mdi:lamp
            show_state: true
            tap_action:
              action: toggle
          - type: button
            entity: switch.sauna_lights_third_reality_2_switch
            name: Sauna Lights
            icon: mdi:ceiling-light
            show_state: true
            tap_action:
              action: toggle
      - type: horizontal-stack
        cards:
          - type: button
            name: Kitchen
            icon: mdi:pot-steam
            tap_action:
              action: call-service
              service: script.reactivate_kitchen_dimmer
          - type: button
            name: Dining Room
            icon: mdi:silverware-fork-knife
            tap_action:
              action: call-service
              service: script.reactivate_dining_room_dimmer
          - type: button
            name: Art Room
            icon: mdi:palette
            tap_action:
              action: call-service
              service: script.reactivate_art_room_dimmer
      - type: button
        name: Reset All Rooms
        icon: mdi:home-lightbulb
        tap_action:
          action: call-service
          service: script.reactivate_all_dimmers
